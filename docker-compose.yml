services:
  postgres:
    image: postgres:15-alpine
    container_name: rs_awal_bros_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rs_awal_bros_kb}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rs_awal_bros_kb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rs_awal_bros_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rs_awal_bros_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-rs_awal_bros_kb}
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - rs_awal_bros_net

networks:
  rs_awal_bros_net:
    name: rs_awal_bros_net
    driver: bridge

volumes:
  postgres_data:
    name: rs_awal_bros_postgres_data
